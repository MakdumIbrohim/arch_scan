[package]
name = "arch_scan_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "arch_scan_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pdf-writer = "0.12"
